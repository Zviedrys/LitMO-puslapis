media:
  input: src/assets/images
  output: /

content:
  - name: items
    label: Items
    type: file
    path: src/data/items.yml
    format: yaml
    list: true

    fields:
      - name: url
        label: URL
        type: string
        required: true

      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images

      - name: text
        label: Alt text
        type: text
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: animals
              label: Animals
            - name: plants
              label: Plants
            - name: places
              label: Places