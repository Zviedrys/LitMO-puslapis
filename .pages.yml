media:
  input: src/assets/images
  output: /

content:
  - name: categories
    label: Categories
    type: collection
    path: src/data/categories
    format: yaml

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: label
        label: Label
        type: string
        required: true

  - name: items
    label: Items
    type: file
    path: src/data/items.yml
    format: yaml
    list: true

    fields:
      - name: url
        label: URL
        type: string
        required: true

      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images

      - name: text
        label: Alt text
        type: text
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: animals
              label: Animals
            - name: plants
              label: Plants
            - name: places
              label: Places
  - name: items2
    label: Items2
    type: collection
    path: src/data/items2
    format: yaml
    filename: "{primary}.yml"

    fields:
      - name: url
        label: URL
        type: string
        required: true

      - name: image
        label: Image
        type: string
        required: true

      - name: text
        label: Alt text
        type: text
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: animals
              label: Animals
            - name: plants
              label: Plants
            - name: places
              label: Places

    view:
      primary: text
      fields:
        - text
        - category
        - image